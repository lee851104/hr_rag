{% extends "base.html" %}
{% block title %}登入｜請假特休問答{% endblock %}
{% block plain %}
<section class="card narrow">
  <div class="brand dark"><span class="logo">假</span><span><b>請假特休問答</b><small>依角色權限・附原文引用</small></span></div>
  <form method="post" action="/login" class="stack">
    <label>帳號<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>密碼<input name="password" type="password" autocomplete="current-password" required></label>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit">登入</button>
  </form>
  <div class="roles">
    <p class="muted small">三個示範帳號，看得到的文件不同：</p>
    <dl>
      <dt>employee 員工</dt><dd>官方法規＋公司通用請假流程</dd>
      <dt>manager 主管</dt><dd>再加上主管內部覆核指引</dd>
      <dt>hr 人資</dt><dd>再加上人資限閱備忘錄</dd>
    </dl>
    <p class="muted small">密碼以本機命令設定。</p>
  </div>
</section>
{% endblock %}
