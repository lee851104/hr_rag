[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-leave-rag"
version = "0.1.0"
description = "繁體中文企業請假 RAG：階段 0 執行契約與本機模型驗證"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.3.4",
    "pydantic==2.12.3",
    "sentence-transformers==5.1.2",
    "transformers==4.57.1",
    "torch @ https://download-r2.pytorch.org/whl/cpu/torch-2.8.0%2Bcpu-cp312-cp312-win_amd64.whl#sha256=2be20b2c05a0cce10430cc25f32b689259640d273232b2de357c35729132256d",
    "httpx==0.28.1",
    "psutil==7.1.1",
    "jieba==0.42.1",
    "rank-bm25==0.2.2",
    "fastapi==0.119.1",
    "uvicorn==0.53.0",
    "python-multipart==0.0.32",
    "jinja2==3.1.6",
    "sentencepiece==0.2.1",
    "openai==3.33.0",
    "tiktoken==0.14.0",
    "opencc-python-reimplemented==0.1.7",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1", "setuptools==80.9.0", "pip==25.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hr_rag = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

